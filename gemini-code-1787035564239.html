<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Productivity Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #1e3a8a; --accent: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; }
        .header { background: linear-gradient(135deg, #1e3a8a, #3b82f6); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 900px) { .container { grid-template-columns: 360px 1fr; } }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .card h2 { font-size: 16px; color: var(--primary); margin-bottom: 15px; border-bottom: 2px solid #eff6ff; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #475569; }
        input[type="text"], input[type="number"], input[type="date"], select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
        .btn { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .kpi-card { background: white; padding: 15px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .kpi-val { font-size: 20px; font-weight: bold; color: var(--primary); }
        .kpi-lbl { font-size: 11px; color: #64748b; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px; border-bottom: 1px solid var(--border); text-align: left; }
        th { background: #f1f5f9; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .badge-green { background: #dcfce7; color: #15803d; }
        .badge-yellow { background: #fef9c3; color: #a16207; }
        .badge-red { background: #fee2e2; color: #b91c1c; }
        .chart-container { position: relative; height: 260px; }
    </style>
</head>
<body>
<div class="header">
    <h1>🚀 Agent Productivity Dashboard</h1>
    <p>Exclude Sat/Sun Working Days | Includes Sat/Sun Work Output</p>
</div>
<div class="container">
    <div>
        <div class="card">
            <h2>Data Entry Controls</h2>
            <div class="form-group"><label>Agent Name</label><input type="text" id="agentName" value="Saurav Pal"></div>
            <div class="form-group"><label>Clinic Video Calls (x5)</label><input type="number" id="video" value="1523"></div>
            <div class="form-group"><label>Camp Audio Calls (x4)</label><input type="number" id="audio" value="1104"></div>
            <div class="form-group"><label>Connected FDB (x3)</label><input type="number" id="fdb" value="7"></div>
            <div class="form-group">
                <label>Working Days Mode</label>
                <select id="dayMode" onchange="toggleDayMode()">
                    <option value="manual">Manual Working Days Entry</option>
                    <option value="daterange">Date Range (Auto Exclude Sat/Sun)</option>
                </select>
            </div>
            <div id="manualDaysBox" class="form-group">
                <label>Working Days Count (Mon-Fri)</label>
                <input type="number" id="workDays" value="21">
            </div>
            <div id="dateRangeBox" class="form-group" style="display:none;">
                <label>Start Date</label><input type="date" id="startDate" style="margin-bottom:8px;">
                <label>End Date</label><input type="date" id="endDate">
            </div>
            <button class="btn" onclick="addAgent()">Calculate & Add Agent</button>
            <hr style="margin:15px 0;">
            <div class="form-group">
                <label>Bulk Excel Upload (.xlsx / .csv)</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event)">
            </div>
        </div>
    </div>
    <div>
        <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-lbl">Total Agents</div><div class="kpi-val" id="kpiAgents">0</div></div>
            <div class="kpi-card"><div class="kpi-lbl">Avg Productivity</div><div class="kpi-val" id="kpiAvgProd">0%</div></div>
            <div class="kpi-card"><div class="kpi-lbl">Top Performer</div><div class="kpi-val" id="kpiTopAgent" style="font-size:14px; color:#15803d;">-</div></div>
        </div>
        <div class="card">
            <h2>📊 Performance Chart (%)</h2>
            <div class="chart-container"><canvas id="prodChart"></canvas></div>
        </div>
        <div class="card">
            <h2>📋 Detailed Breakdown</h2>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr><th>Agent</th><th>Video</th><th>Audio</th><th>FDB</th><th>Total Pts</th><th>Target Pts</th><th>Productivity</th></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script>
let agentData = [
    { name: "Saurav Pal", video: 1523, audio: 1104, fdb: 7, days: 21 },
    { name: "MD Anas", video: 1530, audio: 616, fdb: 32, days: 21 },
    { name: "Shivam Verma", video: 1607, audio: 467, fdb: 2, days: 21 },
    { name: "Jogender Singh", video: 1146, audio: 750, fdb: 4, days: 21 },
    { name: "Renu Gupta", video: 1145, audio: 556, fdb: 0, days: 21 }
];
let chartInstance = null;
window.onload = function() { processAndRender(); };

function toggleDayMode() {
    const m = document.getElementById('dayMode').value;
    document.getElementById('manualDaysBox').style.display = m === 'manual' ? 'block' : 'none';
    document.getElementById('dateRangeBox').style.display = m === 'daterange' ? 'block' : 'none';
}

function getBusinessDays(s, e) {
    let count = 0, cur = new Date(s), end = new Date(e);
    while (cur <= end) { 
        if (cur.getDay() !== 0 && cur.getDay() !== 6) count++; 
        cur.setDate(cur.getDate() + 1); 
    }
    return count;
}

function addAgent() {
    const name = document.getElementById('agentName').value || 'Agent';
    const video = parseInt(document.getElementById('video').value) || 0;
    const audio = parseInt(document.getElementById('audio').value) || 0;
    const fdb = parseInt(document.getElementById('fdb').value) || 0;
    let days = 21;
    if(document.getElementById('dayMode').value === 'manual') {
        days = parseInt(document.getElementById('workDays').value) || 21;
    } else {
        const s = document.getElementById('startDate').value, e = document.getElementById('endDate').value;
        if(s && e) days = getBusinessDays(s, e);
    }
    agentData.push({ name, video, audio, fdb, days });
    processAndRender();
}

function handleFileUpload(e) {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, {type: 'array'});
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
        agentData = rows.map(r => ({
            name: r['Agent'] || r['Name'] || 'Agent',
            video: parseInt(r['Clinic Video Ca'] || r['Video'] || 0),
            audio: parseInt(r['camp'] || r['Audio'] || 0),
            fdb: parseInt(r['Connected Fdl'] || r['FDB'] || 0),
            days: 21
        }));
        processAndRender();
    };
    reader.readAsArrayBuffer(file);
}

function processAndRender() {
    const computed = agentData.map(a => {
        const earned = (a.video * 5) + (a.audio * 4) + (a.fdb * 3);
        const target = a.days * 300;
        const prod = target > 0 ? ((earned / target) * 100).toFixed(2) : 0;
        return { ...a, earned, target, prod: parseFloat(prod) };
    });
    
    document.getElementById('kpiAgents').innerText = computed.length;
    const avg = (computed.reduce((acc, c) => acc + c.prod, 0) / computed.length).toFixed(2);
    document.getElementById('kpiAvgProd').innerText = avg + '%';
    const top = [...computed].sort((a,b) => b.prod - a.prod)[0];
    document.getElementById('kpiTopAgent').innerText = top ? top.name + ' (' + top.prod + '%)' : '-';
    
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    computed.forEach(c => {
        let bClass = c.prod >= 100 ? 'badge-green' : (c.prod >= 80 ? 'badge-yellow' : 'badge-red');
        tbody.innerHTML += `<tr><td><strong>${c.name}</strong></td><td>${c.video}</td><td>${c.audio}</td><td>${c.fdb}</td><td>${c.earned}</td><td>${c.target}</td><td><span class="badge ${bClass}">${c.prod}%</span></td></tr>`;
    });
    
    const ctx = document.getElementById('prodChart').getContext('2d');
    if(chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: computed.map(c => c.name),
            datasets: [{ data: computed.map(c => c.prod), backgroundColor: computed.map(c => c.prod >= 100 ? '#16a34a' : (c.prod >= 80 ? '#eab308' : '#dc2626')), borderRadius: 6 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
    });
}
</script>
</body>
</html>
