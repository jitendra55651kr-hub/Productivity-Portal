<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Report - Unit 2</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
      -webkit-font-smoothing: antialiased; 
    }
    
    body { 
      background-color: #f0fdf4; 
      background-image: radial-gradient(#bbf7d0 0.75px, transparent 0.75px);
      background-size: 16px 16px;
      color: #064e3b; 
      padding: 24px; 
    }
    
    /* Main Top Header Styling */
    header { 
      text-align: center; 
      margin-bottom: 24px; 
      padding: 28px 24px; 
      background: linear-gradient(135deg, #022c22 0%, #064e3b 60%, #0f5132 100%); 
      border-radius: 18px; 
      border: 1px solid #10b981; 
      box-shadow: 0 12px 30px -5px rgba(6, 78, 59, 0.35); 
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: rgba(52, 211, 153, 0.08);
      border-radius: 50%;
      pointer-events: none;
    }
    
    h1 { 
      color: #ffffff; 
      font-size: 32px; 
      font-weight: 900; 
      letter-spacing: 1.2px; 
      text-transform: uppercase; 
      margin-bottom: 6px; 
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    h1 span.title-icon {
      font-size: 34px;
    }
    
    .header-subtitle {
      color: #34d399;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    /* Date & Control Bar */
    .controls-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(8px);
      padding: 14px 22px;
      border-radius: 12px;
      border: 1px solid rgba(52, 211, 153, 0.3);
      margin-bottom: 18px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ecfdf5;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .control-group input[type="date"],
    .control-group input[type="number"] {
      background: #022c22;
      border: 1.5px solid #10b981;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .control-group input[type="date"]:focus,
    .control-group input[type="number"]:focus {
      border-color: #34d399;
      box-shadow: 0 0 8px rgba(52, 211, 153, 0.4);
    }

    .control-group input[type="number"] {
      width: 75px;
      text-align: center;
    }
    
    .upload-container { display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
    input[type="file"] { display: none; }
    .custom-file-upload { 
      background: linear-gradient(135deg, #059669 0%, #10b981 100%); 
      color: #ffffff; 
      padding: 11px 24px; 
      border-radius: 10px; 
      cursor: pointer; 
      font-weight: 800; 
      transition: all 0.2s ease; 
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.4); 
      text-transform: uppercase; 
      font-size: 13px; 
      letter-spacing: 0.8px; 
      border: 1px solid #6ee7b7; 
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .custom-file-upload:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); 
      background: linear-gradient(135deg, #047857 0%, #059669 100%); 
    }
    .file-name { font-size: 13px; color: #a7f3d0; font-weight: 600; }
    
    /* Executive Score Card Grid */
    .summary-cards { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
      gap: 14px; 
      margin-bottom: 28px; 
    }
    
    .card { 
      background: linear-gradient(135deg, #022c22 0%, #064e3b 100%); 
      padding: 18px 12px; 
      border-radius: 14px; 
      border: 1px solid #065f46; 
      border-top: 5px solid #34d399; 
      text-align: center; 
      box-shadow: 0 8px 20px rgba(6, 78, 59, 0.25); 
      transition: transform 0.25s ease, box-shadow 0.25s ease; 
      position: relative;
    }
