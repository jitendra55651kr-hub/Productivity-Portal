<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Hourly Report - Unit 2</title>
  <!-- SheetJS for Excel/CSV Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased; }
    
    body { background-color: #f1f5f9; color: #0f172a; padding: 20px; }
    
    /* Main Top Header Styling */
    header { 
      text-align: center; 
      margin-bottom: 25px; 
      padding: 24px 20px; 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      border-radius: 14px; 
      border: 1px solid #334155; 
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.25); 
    }
    h1 { 
      color: #ffffff; 
      font-size: 32px; 
      font-weight: 900; 
      letter-spacing: 1.5px; 
      text-transform: uppercase; 
      margin-bottom: 4px; 
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2); 
    }
    
    /* Subtitle Styling for UNIT 2 */
    .header-subtitle {
      color: #38bdf8;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    
    .upload-container { display: flex; justify-content: center; align-items: center; gap: 15px; flex-wrap: wrap; }
    input[type="file"] { display: none; }
    .custom-file-upload { 
      background: #2563eb; 
      color: #ffffff; 
      padding: 12px 28px; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 800; 
      transition: all 0.2s ease; 
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); 
      text-transform: uppercase; 
      font-size: 14px; 
      letter-spacing: 0.8px; 
      border: 1px solid #60a5fa; 
    }
    .custom-file-upload:hover { background: #1d4ed8; transform: translateY(-1px); }
    .file-name { font-size: 14px; color: #cbd5e1; font-weight: 600; }
    
    /* Executive Score Card Grid */
    .summary-cards { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); 
      gap: 14px; 
      margin-bottom: 30px; 
    }
    
    /* Uniform Dark Style For ALL Score Cards */
    .card { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      padding: 18px 12px; 
      border-radius: 12px; 
      border: 1px solid #0f172a; 
      border-top: 5px solid #38bdf8; 
      text-align: center; 
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.3); 
      transition: transform 0.2s ease, box-shadow 0.2s ease; 
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(15, 23, 42, 0.4); }
    
    .card h3 { 
      font-size: 13px; 
      color: #ffffff; 
      text-transform: uppercase; 
      margin-bottom: 10px; 
      font-weight: 800; 
      letter-spacing: 0.8px; 
      line-height: 1.2;
    }
    .card p { 
      font-size: 28px; 
      font-weight: 900; 
      color: #ffffff; 
    }

    /* Team Table Container */
    .team-section { 
      background: #ffffff; 
      border-radius: 12px; 
      border: 3px solid #334155; 
      margin-bottom: 30px; 
      overflow: hidden; 
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12); 
    }
    
    /* Dark Slate Gradient Team Header Bar */
    .team-header { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      padding: 16px 20px; 
      font-size: 22px; 
      font-weight: 900; 
      color: #ffffff; 
      letter-spacing: 1px; 
      border-bottom: 3px solid #334155; 
      text-transform: uppercase; 
    }
    
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    
    /* Dark Column Headers with Bigger Font & Darker Borders */
    th { 
      background-color: #0f172a; 
      color: #ffffff; 
      padding: 16px 12px; 
      font-weight: 900; 
      border-bottom: 3px solid #334155; 
      border-right: 2.5px solid #334155; 
      text-transform: uppercase; 
      font-size: 14px; 
      text-align: center; 
      letter-spacing: 0.8px; 
    }
    th:first-child { text-align: left; padding-left: 20px; }
    th:last-child { border-right: none; }
    
    /* Data Cells with Larger Font & Dark Solid Gridlines */
    td { 
      padding: 14px 12px; 
      border-bottom: 2.5px solid #475569; 
      border-right: 2.5px solid #475569; 
      color: #0f172a; 
      font-weight: 800; 
      font-size: 16px; 
    }
    td:last-child { border-right: none; }
    
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) { background-color: #f8fafc; }
    tr:nth-child(odd) { background-color: #ffffff; }
    tr:hover { background-color: #e0f2fe; }
    
    .agent-name { font-weight: 800; color: #0f172a; text-align: left; padding-left: 20px; font-size: 16px; }
    .metric-val { text-align: center; font-size: 17px; color: #0f172a; font-weight: 900; }
    .metric-zero { color: #64748b; font-weight: 700; }
  </style>
</head>
<body>

  <header>
    <h1>AGENT HOURLY REPORT</h1>
    <div class="header-subtitle">UNIT 2</div>
    <div class="upload-container">
      <label for="fileInput" class="custom-file-upload">
        📁 Upload Excel / CSV File
      </label>
      <input type="file" id="fileInput" accept=".csv, .xlsx, .xls">
      <span class="file-name" id="fileName">No file chosen</span>
    </div>
  </header>

  <!-- Top Summary Cards -->
  <div class="summary-cards" id="summaryCards">
    <div class="card"><h3>Total Agents</h3><p id="totAgents">0</p></div>
    <div class="card"><h3>Done Consultation</h3><p id="totDone">0</p></div>
    <div class="card"><h3>Camp</h3><p id="totCamp">0</p></div>
    <div class="card"><h3>Clinic Video Call</h3><p id="totVideoCall">0</p></div>
    <div class="card"><h3>FDB</h3><p id="totFdb">0</p></div>
    <div class="card"><h3>Connected FDB</h3><p id="totConnFdb">0</p></div>
    <div class="card"><h3>IMM FDB</h3><p id="totImmFdb">0</p></div>
    <div class="card"><h3>Connected IMM FDB</h3><p id="totConnImmFdb">0</p></div>
  </div>

  <div id="teamsContainer"></div>

  <script>
    const TEAMS = {
      "TEAM JITENDRA": [
        "Saurav Pal", "Md anas", "Renu Gupta", "Shivam verma", 
        "Jogender singh", "Jayshree Choudhary", "Snigdha pal", 
        "Rashi Gupta", "Kiran thakur"
      ],
      "TEAM DEEPTI": [
        "Renu Rani", "Pooja Rathore", "ROSHNI PRAJAPATI", "GARVIT JHA", 
        "Rajni Saini", "Puja Chauhan", "Shivansh tiwari", "Saifur Janam", 
        "Anjali Gupta", "Roshni chouhan"
      ],
      "TEAM RAVI": [
        "Jyoti Singh unit 2", "Rajendra Mourya", "Apurv Acharya", 
        "Amit Sharma", "Atul Kumar", "Sumit H", "Piyush Verma", 
        "Shivam Shukla"
      ],
      "TEAM SHIVAM": [
        "Nandani", "Kamni Sharma", "Burhan", 
        "Chandrabhanu", "Munsi Sakil Ahmed", "Ashish Yadav", "Chandrabhanu Sukla",
        "MOHD SHAKIB", "Snehal Sukhadeo Gaikwad", "Abuzar Akhtar"
      ],
      "TEAM ISHANT": [
        "Ayushi Saxena", "Harivansh Agarwal", 
        "Smruti Rani Sahoo", "Sushma Chaudhary", "Ashok Pawar", 
        "PRIYA PATIDAR", "YASHWANT SINGH", "Sanjana Khuswaha"
      ]
    };

    document.getElementById('fileInput').addEventListener('change', handleFile);

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('fileName').innerText = file.name;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const data = new Uint8Array(evt.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawRows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
        processData(rawRows);
      };
      reader.readAsArrayBuffer(file);
    }

    function cleanString(str) {
      if (!str) return '';
      return String(str).toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function processData(rows) {
      let headerRowIndex = -1;
      let colMap = {};

      for (let i = 0; i < Math.min(20, rows.length); i++) {
        const row = rows[i];
        if (!row) continue;
        
        row.forEach((cell, colIdx) => {
          const val = cleanString(cell);
          if (val === 'agent' || val === 'agentname' || val === 'name') colMap['agent'] = colIdx;
          if (val.includes('done')) colMap['done'] = colIdx;
          if (val.includes('videocall') || val.includes('clinicvideo') || val === 'teledoc') colMap['videocall'] = colIdx;
          
          if (val === 'immfdb') colMap['imm_fdb'] = colIdx;
          else if (val.includes('connectedimmfdb') || val.includes('connimm')) colMap['conn_imm_fdb'] = colIdx;
          else if (val.includes('connectedfdb') || val.includes('connected')) colMap['conn_fdb'] = colIdx;
          else if (val === 'fdb') colMap['fdb'] = colIdx;
        });

        if (colMap['agent'] !== undefined) {
          headerRowIndex = i;
          break;
        }
      }

      if (headerRowIndex === -1) {
        alert("Could not find 'Agent' column in the uploaded sheet.");
        return;
      }

      const agentStatsMap = {};

      for (let i = headerRowIndex + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || !row[colMap['agent']]) continue;

        const rawName = String(row[colMap['agent']]).trim();
        const cleanName = cleanString(rawName);

        const getNum = (colKey) => {
          if (colMap[colKey] === undefined) return 0;
          const val = parseFloat(row[colMap[colKey]]);
          return isNaN(val) ? 0 : val;
        };

        agentStatsMap[cleanName] = {
          displayName: rawName,
          done: getNum('done'),
          videocall: getNum('videocall'),
          fdb: getNum('fdb'),
          conn_fdb: getNum('conn_fdb'),
          imm_fdb: getNum('imm_fdb'),
          conn_imm_fdb: getNum('conn_imm_fdb')
        };
      }

      renderDashboard(agentStatsMap);
    }

    function renderDashboard(agentStatsMap) {
      const container = document.getElementById('teamsContainer');
      container.innerHTML = '';

      let gTotAgents = 0, gTotDone = 0, gTotCamp = 0, gTotVideoCall = 0, 
          gTotFdb = 0, gTotConnFdb = 0, 
          gTotImmFdb = 0, gTotConnImmFdb = 0;

      Object.keys(TEAMS).forEach(teamName => {
        const members = TEAMS[teamName];
        let tableRows = '';

        members.forEach(member => {
          gTotAgents++;
          const cleanMem = cleanString(member);
          let stats = agentStatsMap[cleanMem];

          if (!stats) {
            const key = Object.keys(agentStatsMap).find(k => {
              const cleanMemAlt = cleanMem.replace('saurabh', 'saurav');
              const kAlt = k.replace('saurabh', 'saurav');
              return k.includes(cleanMem) || cleanMem.includes(k) || kAlt.includes(cleanMemAlt) || cleanMemAlt.includes(kAlt);
            });
            if (key) stats = agentStatsMap[key];
          }

          const s = stats || {
            done: 0, videocall: 0, 
            fdb: 0, conn_fdb: 0, imm_fdb: 0, conn_imm_fdb: 0
          };

          // Formula: Camp = Done Consultation - Clinic Video Call
          const campVal = Math.max(0, s.done - s.videocall);

          gTotDone += s.done;
          gTotCamp += campVal;
          gTotVideoCall += s.videocall;
          gTotFdb += s.fdb;
          gTotConnFdb += s.conn_fdb;
          gTotImmFdb += s.imm_fdb;
          gTotConnImmFdb += s.conn_imm_fdb;

          const fmt = (val) => val <= 0 ? `<span class="metric-zero">0</span>` : val;

          tableRows += `
            <tr>
              <td class="agent-name">${member}</td>
              <td class="metric-val">${fmt(s.done)}</td>
              <td class="metric-val">${fmt(campVal)}</td>
              <td class="metric-val">${fmt(s.videocall)}</td>
              <td class="metric-val">${fmt(s.fdb)}</td>
              <td class="metric-val">${fmt(s.conn_fdb)}</td>
              <td class="metric-val">${fmt(s.imm_fdb)}</td>
              <td class="metric-val">${fmt(s.conn_imm_fdb)}</td>
            </tr>
          `;
        });

        const teamHtml = `
          <div class="team-section">
            <div class="team-header">${teamName}</div>
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>Agent Name</th>
                    <th>Done Consultation</th>
                    <th>Camp</th>
                    <th>Clinic Video Call</th>
                    <th>FDB</th>
                    <th>Connected FDB</th>
                    <th>IMM FDB</th>
                    <th>Connected IMM FDB</th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRows}
                </tbody>
              </table>
            </div>
          </div>
        `;
        container.innerHTML += teamHtml;
      });

      // Update Upper Summary Cards
      document.getElementById('totAgents').innerText = gTotAgents;
      document.getElementById('totDone').innerText = gTotDone.toLocaleString();
      document.getElementById('totCamp').innerText = gTotCamp.toLocaleString();
      document.getElementById('totVideoCall').innerText = gTotVideoCall.toLocaleString();
      document.getElementById('totFdb').innerText = gTotFdb.toLocaleString();
      document.getElementById('totConnFdb').innerText = gTotConnFdb.toLocaleString();
      document.getElementById('totImmFdb').innerText = gTotImmFdb.toLocaleString();
      document.getElementById('totConnImmFdb').innerText = gTotConnImmFdb.toLocaleString();
    }

    renderDashboard({});
  </script>
</body>
</html>
